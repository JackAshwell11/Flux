name: ✨ Feature Request
description: Suggest an idea or improvement
labels: ["type: feature", "status: pending"]
body:
  - type: markdown
    attributes:
      value: |
        **Thanks for taking the time to suggest a feature!**

        Before submitting, please check existing issues to see if this idea
        has already been proposed or implemented.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: |
        Describe the problem or limitation you are experiencing.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: |
        Describe the solution or behaviour you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Describe any alternative solutions or workarounds you have considered.

  - type: textarea
    id: use-cases
    attributes:
      label: Use cases
      description: |
        Describe how this feature would be used and who would benefit from it.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: |
        Add any other context, links, or screenshots related to the request.
